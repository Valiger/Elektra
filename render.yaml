services:
  - type: web
    name: elektra-backend
    runtime: python
    rootDir: elektra/backend
    buildCommand: pip install -r requirements.txt && playwright install chromium
    startCommand: alembic upgrade head && python -m app.db.seed_data && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: /opt/render/project/playwright
      - key: DATABASE_URL
        fromDatabase:
          name: elektra-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
      - key: GEMINI_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: UPLOAD_DIR
        value: ./uploads

databases:
  - name: elektra-db
    plan: free
    databaseName: elektra
    user: elektra
